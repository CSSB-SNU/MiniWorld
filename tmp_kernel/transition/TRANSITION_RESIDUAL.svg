<rect fill="#fff" height="42" rx="5" stroke="#2674bd" stroke-width="1" width="648" x="70" y="300" /><text fill="#243a4c" font-family="Noto Sans CJK KR, Noto Sans KR, DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="81" y="327">squeeze GEMM</text><path d="M 394.0 342 L 394.0 360" fill="none" marker-end="url(#arrow)" stroke="#6b8192" stroke-width="2" /><rect fill="#fff" height="42" rx="5" stroke="#2674bd" stroke-width="1" width="648" x="70" y="360" /><text fill="#243a4c" font-family="Noto Sans CJK KR, Noto Sans KR, DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="81" y="387">BF16(acc) + x → y</text><text fill="#2674bd" font-family="Noto Sans CJK KR, Noto Sans KR, DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="start" x="73" y="430">별도 residual add / 중간 z tensor 없음</text><text fill="#243a4c" font-family="Noto Sans CJK KR, Noto Sans KR, DejaVu Sans, sans-serif" font-size="22" font-weight="700" text-anchor="start" x="56" y="600">BACKWARD</text><rect fill="#edf5ff" height="254" rx="10" stroke="#2674bd" stroke-width="2" width="676" x="56" y="620" /><text fill="#2674bd" font-family="Noto Sans CJK KR, Noto Sans KR, DejaVu Sans, sans-serif" font-size="17" font-weight="700" text-anchor="start" x="70" y="648">LN dx epilogue + identity dy</text><rect fill="#fff" height="42" rx="5" stroke="#2674bd" stroke-width="1" width="648" x="70" y="665" /><text fill="#243a4c" font-family="Noto Sans CJK KR, Noto Sans KR, DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="81" y="692">LN 미분 → dx_LN</text><path d="M 394.0 707 L 394.0 725" fill="none" marker-end="url(#arrow)" stroke="#6b8192" stroke-width="2" /><rect fill="#fff" height="42" rx="5" stroke="#2674bd" stroke-width="1" width="648" x="70" y="725" /><text fill="#243a4c" font-family="Noto Sans CJK KR, Noto Sans KR, DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="81" y="752">BF16(dx_LN) + dy → dx</text><path d="M 394.0 767 L 394.0 785" fill="none" marker-end="url(#arrow)" stroke="#6b8192" stroke-width="2" /><rect fill="#fff" height="42" rx="5" stroke="#2674bd" stroke-width="1" width="648" x="70" y="785" /><text fill="#243a4c" font-family="Noto Sans CJK KR, Noto Sans KR, DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="81" y="812">dγ / dβ는 LN branch만으로 계산</text><text fill="#2674bd" font-family="Noto Sans CJK KR, Noto Sans KR, DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="start" x="73" y="855">Triton _ln_bwd_residual_kernel</text><rect fill="#fff" height="930" rx="10" stroke="#cbd7e2" stroke-width="1" width="716" x="812" y="115" /><text fill="#243a4c" font-family="Noto Sans CJK KR, Noto Sans KR, DejaVu Sans, sans-serif" font-size="23" font-weight="700" text-anchor="start" x="830" y="149">B · H100 hand-CUDA</text><text fill="#516a80" font-family="Noto Sans CJK KR, Noto Sans KR, DejaVu Sans, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="830" y="179">현재 기본값: residual fusion ON</text><text fill="#243a4c" font-family="Noto Sans CJK KR, Noto Sans KR, DejaVu Sans, sans-serif" font-size="22" font-weight="700" text-anchor="start" x="832" y="235">FORWARD</text><rect fill="#fff1e6" height="194" rx="10" stroke="#b45a23" stroke-width="2" width="676" x="832" y="255" /><text fill="#b45a23" font-family="Noto Sans CJK KR, Noto Sans KR, DejaVu Sans, sans-serif" font-size="17" font-weight="700" text-anchor="start" x="846" y="283">transition_b2b_rs_wgmma_kernel</text><rect fill="#fff" height="42" rx="5" stroke="#b45a23" stroke-width="1" width="648" x="846" y="300" /><text fill="#243a4c" font-family="Noto Sans CJK KR, Noto Sans KR, DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="857" y="327">LN tile → expand → SwiGLU</text><path d="M 1170.0 342 L 1170.0 360" fill="none" marker-end="url(#arrow)" stroke="#6b8192" stroke-width="2" /><rect fill="#fff" height="42" rx="5" stroke="#b45a23" stroke-width="1" width="648" x="846" y="360" /><text fill="#243a4c" font-family="Noto Sans CJK KR, Noto Sans KR, DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="857" y="387">squeeze + residual → y</text><text fill="#b45a23" font-family="Noto Sans CJK KR, Noto Sans KR, DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="start" x="849" y="430">별도 residual add / 중간 z tensor 없음</text><text fill="#243a4c" font-family="Noto Sans CJK KR, Noto Sans KR, DejaVu Sans, sans-serif" font-size="22" font-weight="700" text-anchor="start" x="832" y="600">BACKWARD</text><rect fill="#f1f4f7" height="300" rx="10" stroke="#697887" stroke-dasharray="7 5" stroke-width="2" width="676" x="832" y="620" /><text fill="#697887" font-family="Noto Sans CJK KR, Noto Sans KR, DejaVu Sans, sans-serif" font-size="17" font-weight="700" text-anchor="start" x="846" y="648">LN dx epilogue + identity dy</text><rect fill="#fff" height="42" rx="5" stroke="#697887" stroke-width="1" width="648" x="846" y="665" /><text fill="#243a4c" font-family="Noto Sans CJK KR, Noto Sans KR, DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="857" y="692">LN 미분 → dx_LN</text><path d="M 1170.0 707 L 1170.0 725" fill="none" marker-end="url(#arrow)" stroke="#6b8192" stroke-width="2" /><rect fill="#fff" height="42" rx="5" stroke="#697887" stroke-width="1" width="648" x="846" y="725" /><text fill="#243a4c" font-family="Noto Sans CJK KR, Noto Sans KR, DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="857" y="752">BF16(dx_LN) + dy → dx</text><path d="M 1170.0 767 L 1170.0 785" fill="none" marker-end="url(#arrow)" stroke="#6b8192" stroke-width="2" /><rect fill="#fff" height="42" rx="5" stroke="#697887" stroke-width="1" width="648" x="846" y="785" /><text fill="#243a4c" font-family="Noto Sans CJK KR, Noto Sans KR, DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="857" y="812">dγ / dβ는 LN branch만으로 계산</text><text fill="#697887" font-family="Noto Sans CJK KR, Noto Sans KR, DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="start" x="849" y="855">D128 large pair: Triton</text><text fill="#697887" font-family="Noto Sans CJK KR, Noto Sans KR, DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="start" x="849" y="878">그 외 eligible D≤512: CUDA main + affine reduce</text><text fill="#697887" font-family="Noto Sans CJK KR, Noto Sans KR, DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="start" x="849" y="901">CUDA 미지원/실패: Triton residual LN</text><rect fill="#fff" height="930" rx="10" stroke="#cbd7e2" stroke-width="1" width="716" x="1588" y="115" /><text fill="#243a4c" font-family="Noto Sans CJK KR, Noto Sans KR, DejaVu Sans, sans-serif" font-size="23" font-weight="700" text-anchor="start" x="1606" y="149">C · H100 CuTe</text><text fill="#516a80" font-family="Noto Sans CJK KR, Noto Sans KR, DejaVu Sans, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="1606" y="179">현재 기본값: residual fusion ON</text><text fill="#243a4c" font-family="Noto Sans CJK KR, Noto Sans KR, DejaVu Sans, sans-serif" font-size="22" font-weight="700" text-anchor="start" x="1608" y="235">FORWARD</text><rect fill="#eaf8f1" height="194" rx="10" stroke="#168266" stroke-width="2" width="676" x="1608" y="255" /><text fill="#168266" font-family="Noto Sans CJK KR, Noto Sans KR, DejaVu Sans, sans-serif" font-size="17" font-weight="700" text-anchor="start" x="1622" y="283">RoundedResidualSm90</text><rect fill="#fff" height="42" rx="5" stroke="#168266" stroke-width="1" width="648" x="1622" y="300" /><text fill="#243a4c" font-family="Noto Sans CJK KR, Noto Sans KR, DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="1633" y="327">squeeze GEMM</text><path d="M 1946.0 342 L 1946.0 360" fill="none" marker-end="url(#arrow)" stroke="#6b8192" stroke-width="2" /><rect fill="#fff" height="42" rx="5" stroke="#168266" stroke-width="1" width="648" x="1622" y="360" /><text fill="#243a4c" font-family="Noto Sans CJK KR, Noto Sans KR, DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="1633" y="387">BF16(acc) + x → y</text><text fill="#168266" font-family="Noto Sans CJK KR, Noto Sans KR, DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="start" x="1625" y="430">별도 residual add / 중간 z tensor 없음</text><text fill="#243a4c" font-family="Noto Sans CJK KR, Noto Sans KR, DejaVu Sans, sans-serif" font-size="22" font-weight="700" text-anchor="start" x="1608" y="600">BACKWARD</text><rect fill="#f1f4f7" height="300" rx="10" stroke="#697887" stroke-dasharray="7 5" stroke-width="2" width="676" x="1608" y="620" /><text fill="#697887" font-family="Noto Sans CJK KR, Noto Sans KR, DejaVu Sans, sans-serif" font-size="17" font-weight="700" text-anchor="start" x="1622" y="648">LN dx epilogue + identity dy</text><rect fill="#fff" height="42" rx="5" stroke="#697887" stroke-width="1" width="648" x="1622" y="665" /><text fill="#243a4c" font-family="Noto Sans CJK KR, Noto Sans KR, DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="1633" y="692">LN 미분 → dx_LN</text><path d="M 1946.0 707 L 1946.0 725" fill="none" marker-end="url(#arrow)" stroke="#6b8192" stroke-width="2" /><rect fill="#fff" height="42" rx="5" stroke="#697887" stroke-width="1" width="648" x="1622" y="725" /><text fill="#243a4c" font-family="Noto Sans CJK KR, Noto Sans KR, DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="1633" y="752">BF16(dx_LN) + dy → dx</text><path d="M 1946.0 767 L 1946.0 785" fill="none" marker-end="url(#arrow)" stroke="#6b8192" stroke-width="2" /><rect fill="#fff" height="42" rx="5" stroke="#697887" stroke-width="1" width="648" x="1622" y="785" /><text fill="#243a4c" font-family="Noto Sans CJK KR, Noto Sans KR, DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="1633" y="812">dγ / dβ는 LN branch만으로 계산</text><text fill="#697887" font-family="Noto Sans CJK KR, Noto Sans KR, DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="start" x="1625" y="855">D128 large pair: Triton</text><text fill="#697887" font-family="Noto Sans CJK KR, Noto Sans KR, DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="start" x="1625" y="878">그 외 eligible D≤512: CUDA main + affine reduce</text><text fill="#697887" font-family="Noto Sans CJK KR, Noto Sans KR, DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="start" x="1625" y="901">CUDA 미지원/실패: Triton residual LN</text><rect fill="#e7eef7" height="234" rx="10" stroke="none" stroke-width="1" width="2268" x="36" y="1070" /><text fill="#243a4c" font-family="Noto Sans CJK KR, Noto Sans KR, DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="54" y="1100">실선 외곽 = 명시한 커널 내부의 융합. 보라색 = cuBLAS 호출 경계. 회색 점선 = PyTorch / compiler 연산.</text><text fill="#243a4c" font-family="Noto Sans CJK KR, Noto Sans KR, DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="54" y="1127">노랑 = HBM tensor. 화살표는 의존 관계이며 동시 실행을 뜻하지 않음. cuBLAS 호출 수와 GPU launch 수는 다를 수 있음.</text><text fill="#243a4c" font-family="Noto Sans CJK KR, Noto Sans KR, DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="54" y="1154">Transition(x)에는 mask 인자·dropout이 없음. 조건부 AdaLN Transition은 별도 모듈이며 이 그림 범위 밖.</text><text fill="#243a4c" font-family="Noto Sans CJK KR, Noto Sans KR, DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="54" y="1181">세 경로 모두 residual을 포함한다. H100의 비교 대상 Triton에도 forward/backward residual 융합이 이미 적용돼 있다.</text><text fill="#243a4c" font-family="Noto Sans CJK KR, Noto Sans KR, DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="54" y="1208">추가 개발: b2b CUDA 본체에 BF16 xn 벡터 store를 추가하고 saved-xn backward를 연결. residual 융합은 유지.</text><text fill="#243a4c" font-family="Noto Sans CJK KR, Noto Sans KR, DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="54" y="1235">L384/D128에서 z 또는 dx_LN의 별도 write+read 제거량은 각각 72MiB. 이미 융합된 Triton 대비 추가 절약량이 아니다.</text><text fill="#243a4c" font-family="Noto Sans CJK KR, Noto Sans KR, DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="54" y="1262">C의 dA@Wa + dB@Wb gradient 합산은 residual과 별개이며 남아 있다. 전체 학습 성능은 TRANSITION.svg 참고.</text></svg>