DB_PATH: /public_data/bsoohyuncd/
train_db:
  cif_db_path: ${..DB_PATH}/BioMolDB_20260224/cif_attached_train.lmdb
  a3m_db_path: ${..DB_PATH}/BioMolDB_20260224/a3m.lmdb
  edge_id_to_bias_path: ${..DB_PATH}/BioMolDB_20260224/metadata/train_edge_node.tsv
  
valid_db:
  cif_db_path: ${..DB_PATH}/BioMolDB_20260224/cif_attached_valid_2.lmdb
  a3m_db_path: ${..DB_PATH}/BioMolDB_20260224/a3m.lmdb
  edge_id_to_bias_path: ${..DB_PATH}/BioMolDB_20260224/metadata/valid2_edge_node.tsv

crop:
  max_tokens: 384
  max_atoms: 4096
  min_segment_size: 1
  max_segment_size: 41

  monomer_only: false
  remain_invalid_tokens: false

  bucket_msa_size: 128
  bucket_token_size: 128
  bucket_atom_size: 1024

msa:
  n_samples: 1
  max_msa_depth: 384
  missing_policy: "query"

tokenizer:
  level: "atom"

sampler:
  antibody_antibody: 0.1 # 3096, 0.3%, 0.1
  antibody_nucleic_acid: 20.0 # 27+30=57, 1.12%, 19.7
  antibody_protein: 3.0 # 5091, 15%, 2.95

  DNA_DNA: 0.25 # 8045, 1.98%, 0.25
  DNA_RNA: 2.0 # 462, 2.27%, 4.92
  RNA_RNA: 0.5 # 3983, 1.96%, 0.49
  NA_NA: 2.0 # 40+43+41=124, 1.22%, 9.84

  protein_nucleic_acid: 0.5 # 27386 + 9608 + 165= 36994, 18.2%, 0.49
  protein_protein: 1.0 # 43524, 42.8%, 0.98
  protein_ligand: 0.1 # 133547, 13.1%, 0.1

  ligand_ligand: 0.01 # 35804, 0.35%, 0.01

  etc_interface: 0.05 # 5741+6201+4890+197+75+17+57=17178, 0.8%, 0.05
  sole: 0.5 # 1462, 0.7%, 0
