# [S1 / EDM2 option-1] msa3_24_3 NO-SINGLE + QK-norm + bf16 + pair-bias RMSNorm
#   + EDM2 FORCED WEIGHT NORMALIZATION on the diffusion DiTs.
#
# IDENTICAL to config_exp_msa3_24_3_no_single_qknorm_biasnorm_edm.yaml EXCEPT:
#   - magnitude_preserving=True on atom_dit (atom enc/dec) and token_dit
#     (token DiT). This swaps the scale-invariant matmuls (q/k/v, pair-bias
#     to_bias, transition expand_a/b) to MPLinear = EDM2 Algorithm 1 forced
#     weight normalization (||w|| pinned to sqrt(fan_in) each step + on-use
#     normalization). Targets the ||w|| drift (124x) that drove the epoch~526
#     silent sampling collapse.
#
# S1 scope: forced-WN + EDM2 inverse-sqrt LR. No mp_sum residual, no rotation
# modulation, no MP fixed-function, no extra scalar gains, same Adam (no weight
# decay), same trunk freeze.
#
# LR: forced-WN pins ||w||, removing the implicit LR decay that weight growth
# used to provide -> it MUST be paired with EDM2 inverse-sqrt LR (EDM2 Eq.67).
# That schedule is selected at LAUNCH via env EDM2_INV_SQRT_LR=1 (+ EDM2_LR_TREF),
# NOT in this yaml (the run script reads the env). See the commands/ files.
#
# Run with scripts/run_miniworld_no_single_edm_train.py.
defaults:
  - model: large_msa3_24_3_no_single_qknorm
  - train: exp_msa383
  - data: full_train_balanced_v3_crop384_atom_gap
  - diffuser: edm
  - loss: wo_smoothlddt
  - _self_

model:
  diffusion:
    atom_dit:
      use_bias_norm: True
      magnitude_preserving: True   # EDM2 forced weight normalization (S1)
    token_dit:
      use_bias_norm: True
      magnitude_preserving: True   # EDM2 forced weight normalization (S1)

train:
  comment: "S1 msa3_24_3 no-single qknorm bf16 biasnorm + EDM2 forced-WN (option-1)"
  run_dir: "logs/exp/msa3_24_3-no-single-qknorm-bf16-biasnorm-mp-edm/"
  # 16 GPU (2 node x 8) x num_batch(1) x grad_accum(16) => eff. batch 256.
  grad_accum_steps: 16
