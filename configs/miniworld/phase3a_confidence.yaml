# PHASE 3a — attach a confidence head (pLDDT / PAE / PDE) on top of the FROZEN phase-2b
# structure model (trunk + EDM diffusion) and train ONLY the confidence head with per-bin
# cross-entropy against targets computed from a predicted structure vs GT.
# Short crop (L=384), long run (50 epochs); phase 3b then finishes at L=768.
# See docs/pipeline.md.
#
# Seed weights come from a phase-2b checkpoint (trunk + diffusion), e.g.:
#   runs/v1.0.0/phase2b/large_diffusion_L768/.../checkpoints/last.pt   (pass via --ckpt)
#
# The param_policy (default: freeze_loaded) LOADS + FREEZES every param present in the
# checkpoint (trunk + diffusion + to_token_single_trunk) and re-inits + trains everything
# else (confidence_head). On a requeue the checkpoint also contains confidence_head, so
# load_existing keeps it TRAINABLE.
#
# DIFFUSION STEP: the predicted structure the confidence head scores comes from a FULL
# frozen diffusion rollout (train.predict_timesteps). How many steps / whether to run inline
# per step or read a precomputed cache is an OPEN decision — the seam is
# miniworld.models.confidence.client.Client.predict_structure. num_augment does NOT apply.
#
# Crop: 384-token / 4096-atom. The rollout is the cost driver, so the short crop is what
# makes 50 epochs affordable. NEW wandb run (phase-3a-specific run_dir).
defaults:
  - model: large_swa_pf48_confidence
  - train: default
  - data: H100_default
  - loss: confidence_only
  - _self_

data:
  crop:
    max_tokens: 384
    max_atoms: 4096

train:
  comment: "v1.0.0-phase3a-confidence-large-L384"
  run_dir: "runs/v1.0.0/phase3a/large_confidence_L384"
  num_epoch: 50
  bucket_token_multiple: 384   # single bucket = 384 crop (one CUDA-graph shape)
  bucket_atom_multiple: 4096
  # Confidence head is small; compile OFF by default (the expensive part is the frozen
  # rollout, which is not compiled here). Turn on after the rollout policy is decided.
  compile: False
  trunk_compile_mode: ""
  optimizer: "Adam"
  # LR for a from-scratch confidence head on a fully frozen structure model.
  max_lr: 1e-3
  min_lr: 1e-4
  warmup_steps: 1000
  decay_steps: 5e4
  # DIFFUSION-STEP SEAM: full frozen rollout steps for the predicted structure.
  predict_timesteps: 200
  use_wandb: True
  wandb_project: "MiniWorld"

  # Load + FREEZE the phase-2b structure model from --ckpt; train only confidence_head.
  param_policy:
    enabled: true
    default: freeze_loaded          # trunk + diffusion (present in the 2b ckpt) -> FROZEN
    load_existing:
      - confidence_head             # new head -> reinit+train; on requeue stays trainable

# EDM diffuser (AF3 preconditioning) — identical to phase 2; used to build the solver
# that produces the predicted structure the confidence head scores.
diffuser:
  type: EDM
  seed: 0
  method: AF3
  scheduler:
    method: AF3
    P_mean: -1.2
    P_std: 1.5
    sigma_data: 16.0
    sigma_max: 160.0
    sigma_min: 4.0e-4
    rho: 7.0
    use_time_augmentation: true
