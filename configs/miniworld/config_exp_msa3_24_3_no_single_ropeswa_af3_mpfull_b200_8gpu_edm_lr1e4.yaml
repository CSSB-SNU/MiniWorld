# [FULL EDM2 / ROPE-SWA AF3 / B200 8GPU] msa3_24_3 NO-SINGLE.  --- LR SWEEP: max_lr=1e-4 ---
#
# Single-variable copy of config_exp_msa3_24_3_no_single_ropeswa_af3_mpfull_b200_8gpu_edm.yaml
# with ONLY max_lr lowered 3.0e-3 -> 1.0e-4 (matches the swa_fixinit / default LR).
# Everything else identical (inverse_sqrt, warmup=5000, t_ref=5000, mp_full, grad_accum=32).
# Purpose: test whether the high final loss of the 3e-3 run is caused by the 30x LR
# or by mp_full itself. At 1e-4 the warmup-phase LR matches swa_fixinit, isolating mp_full.
#
# Full diffusion-module EDM2/DiT-MP style with the SWA/ESMFold2 no-atom-pair
# atom path enabled:
#   - model.diffusion.mp_full=True converts every diffusion-module Linear to
#     MPLinear EXCEPT atom decoder final_denoising, which stays raw zero Linear.
#   - token DiT uses MPLinear + rotation AdaLN + mp_sum + MP-SwiGLU.
#   - RoPE-SWA AF3 atom encoder/decoder also get MPLinear + rotation + mp_sum;
#     attention core remains 3D RoPE + sliding-window attention, no atom-pair.
#   - non-block conditioning/projection layers are recursively converted too.
# Optimizer is Adam beta2=0.99; config enables EDM2 inverse-sqrt LR.
defaults:
  - model: large_msa3_24_3_no_single_qknorm
  - train: exp_msa383
  - data: full_train_balanced_v3_crop384_atom_gap
  - diffuser: edm
  - loss: wo_smoothlddt
  - _self_

model:
  diffusion:
    mp_full: True
    autocast_bf16: False
    atom_dit:
      use_bias_norm: True
      use_rotation: True
      residual_t: 0.3
    token_dit:
      use_bias_norm: True
      use_rotation: True
      residual_t: 0.3
    swa_atom:
      block_style: af3
      n_block: 3
      n_head: 4
      swa_window_size: 128
      expansion_ratio: 2
      n_spatial_rope_pairs_per_axis: 2
      spatial_rope_base_frequency: 20.0
      n_uid_rope_pairs: 10
      uid_rope_base_frequency: 10000.0
      residual_t: 0.3

train:
  comment: "LR SWEEP max_lr=1e-4: full-EDM2/DiT-MP + RoPE-SWA AF3 (single-var vs 3e-3 run)"
  run_dir: "logs/exp/msa3_24_3-no-single-ropeswa-af3-mpfull-b200-8gpu-edm-lr1e4/"
  grad_accum_steps: 32
  compile: True
  optimizer: "Adam"
  adam_beta1: 0.9
  adam_beta2: 0.99
  lr_schedule: "inverse_sqrt"
  lr_decay_ref_steps: 5000
  max_lr: 1.0e-4
