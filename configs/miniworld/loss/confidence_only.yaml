# phase 3 confidence loss weights (per-bin cross-entropy).
# PAE ON: the frame-aligned target uses per-token frames (N/CA/C for protein,
# C1'/C3'/C4' for nucleotides; single-atom ligand/ion tokens invalid) built from the
# token_frame_atoms dataset feature. pLDDT is NA/ligand-aware (30 A NA neighbors,
# ligand polymer-only).
plddt_loss: 1.0
pde_loss: 1.0
pae_loss: 1.0
