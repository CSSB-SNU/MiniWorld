# Experiment msa3_24_3 NO-SINGLE + QK-norm, AF3-like EDM.
# IDENTICAL to config_exp_msa3_24_3_no_single_qknorm_bf16_edm.yaml EXCEPT precision:
#   - diffusion forward runs in fp32 (autocast_bf16=False)
#   - ONLY the attention core (q/k/v/bias Triton kernel) stays bf16
#     (handled in code: AugmentedAttentionPairBias casts to bf16 around the
#      kernel; model.py fp32 path casts trunk conditioning to fp32).
# Everything else (data / model / LR / trunk freeze / start ckpt) unchanged.
# Run with scripts/run_miniworld_no_single_edm_train.py.
defaults:
  - model: large_msa3_24_3_no_single_qknorm
  - train: exp_msa383
  - data: full_train_balanced_v3_crop384_atom_gap
  - diffuser: edm
  - loss: wo_smoothlddt
  - _self_

model:
  diffusion:
    autocast_bf16: False   # fp32 diffusion forward; attention core bf16 in-kernel

train:
  comment: "exp msa3_24_3 no-single + qknorm: fp32 diffusion, attention-core bf16"
  run_dir: "logs/exp/msa3_24_3-no-single-qknorm-fp32attnbf16-edm/"
  # 16 GPU (2 node x 8) x num_batch(1) x grad_accum(16) => eff. batch 256.
  grad_accum_steps: 16
