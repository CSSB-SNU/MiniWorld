# Distogram-only MiniSWAModel — LARGE trunk (48 MiniPairformer + 4 MiniMSA), deep d16k MSA.
# H100, eff batch 256 (= grad_accum 32 * 8 GPU; grad_accum is scaled at submit for other GPU counts).
#
# Only the deltas vs the defaults live here; the autoscale launcher injects the DYNAMIC values
# (grad_accum, run_dir, job_name, ckpt, use_wandb). Everything else comes from the defaults:
#   model=large_swa_pf48 -> pf48 / msa4, recycle_max=4, use_template, template out_init=default
#   data=H100_default    -> deep d16k MSA (max_msa_depth 2048), AF3 distill mix (disordered 0.02)
#   train=default        -> bucket_msa_multiple 2048
defaults:
  - model: large_swa_pf48
  - train: default
  - data: H100_default
  - loss: distogram_only
  - _self_

model:
  shared:
    n_distogram_bins: 96      # 64 -> 96 CB-distogram bins
train:
  num_epoch: 800
loss:
  distogram_cb_target: true
