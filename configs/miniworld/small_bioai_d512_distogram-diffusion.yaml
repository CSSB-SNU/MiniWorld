# EDM distogram-DIFFUSION run — SMALL trunk (pf4 / msa2 / no template) on the BioAI
# unified dataloader, shallow d512 MSA cap. The distogram is GENERATED by denoising
# the bin-index image instead of a categorical head; n_recycle_max=1 -> a single
# conditioning trunk pass, the diffusion reverse process replaces recycling.
#
# {tier}_{server}_{dataset}_{head} = small / bioai / d512 / distogram-diffusion.
# Only the deltas vs the defaults live here (convention pattern):
#   model=small_swa_pf4_distogram-diffusion -> pf4/msa2, notmpl, recycle1, EDM block
#   data=bioai_default   -> train_item_20210930 + resources_20210930 unified resolver
#     + reldate bias; MSA capped to depth 512 below (no bioai_d512 db exists — the cap
#     just reads 512 rows from the d16k/d2k dbs). The reldate-filtered item list is
#     release-date consistent with the cif LMDB, avoiding the missing-key crash the
#     pre-reldate list hit.
#   train=default        -> fabric + compile off (EDM per-step noise is not capturable)

defaults:
  - model: small_swa_pf4_distogram-diffusion
  - train: default
  - data: bioai_default
  - loss: distogram_only
  - _self_

model:
  shared:
    n_distogram_bins: 96          # 64 -> 96 CB-distogram bins (diffusion resolution;
                                  # sigma_data/bin_center in the model were measured here)
data:
  msa:
    max_msa_depth: 512            # shallow d512 cap for small-model throughput
train:
  num_epoch: 800
  # The EDM loss samples random sigma/noise per step (host-side) -> NOT CUDA-graph
  # capturable. n_recycle_max=1 would otherwise auto-route to the cudagraph trainer,
  # so force the Fabric path and disable compile.
  force_trainer: fabric
  compile: False
  bucket_msa_multiple: 512        # match max_msa_depth 512 (default is 2048)
  run_dir: "logs/distogram_diffusion_reldate/"
  comment: "EDM distogram-diffusion small pf4/msa2/notmpl — bioai reldate item, d512 MSA cap"
loss:
  distogram_cb_target: true       # CB/pseudo-beta target (diffusion uses rep-atom)
