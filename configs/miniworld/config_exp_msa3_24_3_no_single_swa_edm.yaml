# [SWA-ATOM] msa3_24_3 NO-SINGLE — ESMFold2-style atom attention on PLAIN EDM.
#
# This is plain EDM (Karras 2022) — NOT EDM2. No magnitude preservation
# (mp_full), no rotation modulation, no inverse-sqrt LR schedule. ESMFold2's
# diffusion is standard EDM preconditioning + DiT adaLN-Zero + qk-norm.
#
# Single-variable A/B vs config_exp_msa3_24_3_no_single_qknorm_biasnorm_edm.yaml
# (the plain-EDM qknorm+biasnorm baseline): the ONLY change is the atom-level
# attention. The AF3 block-local atom attention + the O(L_atom^2) atom-pair bias
# tensor are replaced by the ESMFold2 SWAAtomTransformer (Algorithm 6/7/8):
#   - sliding-window attention (FlashAttention, window=128), no atom-pair tensor;
#   - inter-atom geometry via 3D + per-residue-UID RoPE on q/k
#     (from reference.pos / reference.space_uid);
#   - DiT adaLN-Zero blocks with qk-norm.
#
# The token-level DiffusionTransformer is UNCHANGED (AF3 pair-bias) and uses the
# base model's qk-norm only. To match ESMFold2's token attention (which uses
# NEITHER qk-norm NOR a pair-bias RMSNorm), use_bias_norm is left off here.
# NOTE: pair-bias RMSNorm was MiniWorld's fix for the ep~505 attention-logit
# growth divergence on the token DiT — dropping it risks reintroducing that.
# Watch the token-side attention-logit spread early in training.
#
# Run with scripts/run_miniworld_no_single_edm_train.py.
defaults:
  - model: large_msa3_24_3_no_single_qknorm
  - train: exp_msa383
  - data: full_train_balanced_v3_crop384_atom_gap
  - diffuser: edm
  - loss: wo_smoothlddt
  - _self_

model:
  diffusion:
    # NO mp_full / NO rotation / NO bias_norm (EDM2 + token-side extras). Token
    # DiT = base (qk-norm only), matching ESMFold2's plain pair-bias attention.
    # ESMFold2 SWA atom transformer (replaces AF3 atom attention + atom pair).
    swa_atom:
      n_block: 3
      n_head: 4                    # head_dim = d_single_atom(128) / 4 = 32
      swa_window_size: 128
      expansion_ratio: 2
      n_spatial_rope_pairs_per_axis: 2   # 3 axes * 2 = 6 spatial rope freqs
      spatial_rope_base_frequency: 20.0
      n_uid_rope_pairs: 10               # 6 + 10 = 16 = head_dim/2 (exact fill)
      uid_rope_base_frequency: 10000.0

train:
  comment: "SWA-atom msa3_24_3 no-single (ESMFold2 atom attn, plain EDM, qknorm+biasnorm)"
  run_dir: "logs/exp/msa3_24_3-no-single-swa-edm/"
  grad_accum_steps: 16
