# Experiment msa3_24_3 + ESMFold2-style atom attention (SWA + 3D RoPE + QK-norm,
# no atom-level pair bias). Identical to config_exp_msa3_24_3_edm.yaml except
# model = large_msa3_24_3_swa, so it is a clean A/B against that baseline.
# Run: scripts/run_miniworld_edm_only_train.py
#   torchrun --nnodes=1 --nproc_per_node=8 scripts/run_miniworld_edm_only_train.py train \
#     --ckpt epoch=0430.pt --no-ckpt-strict \
#     --config configs/miniworld/config_exp_msa3_24_3_edm_swa.yaml \
#     --job-name exp-msa3_24_3-edm-swa
defaults:
  - model: large_msa3_24_3_swa
  - train: exp_msa383
  - data: full_train_balanced_v3_crop384
  - diffuser: edm
  - loss: wo_smoothlddt
  - _self_

train:
  comment: "exp msa3_24_3 + SWA/3D-RoPE/QK-norm atom attn (no pair bias)"
  run_dir: "logs/exp/msa3_24_3-edm-swa/"
