# EDM distogram-DIFFUSION config: small trunk (4 pairformer / 2 msa / no template),
# the distogram is GENERATED by denoising the bin-index image instead of a categorical
# head. n_recycle_max=1 -> single conditioning trunk pass; the diffusion reverse process
# replaces recycling. 4x H100, eff batch 256.
#
# Data: inherits the d512 BioAI mix (train_item.tsv + resources_d512, a3m_d512 ~10G) and
# caps MSA at depth 512 at load time (max_msa_depth) — the depth-512 throughput choice,
# without needing the retired per-item d512 MSA dbs.
defaults:
  - model: medium_distogram_swa_pf4_notmpl_diffusion
  - train: distogram_swa_af3_mix_8gpu
  - data: full_train_af3_mix_no_disordered_bioai_d512
  - loss: distogram_only
  - _self_

data:
  msa:
    max_msa_depth: 512   # d512 MSA dbs (a3m_d512 ~10G, far lighter than d16k 142G)
  # Train at crop=384 (4x less pair area than 768). sigma_data / bin_center in the model
  # config MUST be measured at THIS crop + n_distogram_bins (see
  # docs/distogram_diffusion_sigma_data.md).
  crop:
    max_tokens: 384
    max_atoms: 4096
train:
  bucket_msa_multiple: 512
  # The EDM loss samples random sigma/noise per step (host-side) -> NOT CUDA-graph
  # capturable. n_recycle_max=1 would otherwise auto-route to the cudagraph trainer,
  # so force the Fabric path.
  force_trainer: fabric
