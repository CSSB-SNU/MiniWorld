# unified train_item + resources.lmdb dataloader. Throughput/loss twin of
# config_distogram_swa_af3_mix_bioai_8gpu.yaml but with the small model.

defaults:
  - model: medium_distogram_swa_pf8_notmpl
  - train: distogram_swa_af3_mix_8gpu
  - data: full_train_af3_mix_no_disordered_bioai
  - loss: distogram_only
  - _self_
