# v2.0.0 phase 2a: v1.0.1 recipe with the token DiT replaced by BiasOnlyTokenDiT --
# attention logits are ONE shared softmax(pair bias) for all 24 blocks and all augments,
# value-only attention (no q/k, no qk-norm); AdaLN, value gate, conditioned output scale,
# ConditionedTransition and residuals unchanged. Parameter names differ from v1 -> fresh
# phase-2 training on a v1.x/v1.2 trunk. The diffusion module runs in bf16 (params and
# activations; norm affine params stay fp32, loss on an fp32 upcast of the output) -- v1 ran it
# in fp32 (Fabric 32-true, TF32 GEMMs). See src/miniworld/modules/bias_only_token_dit.py.
defaults:
  - phase2a_diffusion_v101
  - _self_

train:
  comment: "v2.0.0-phase2a-diffusion-bias-only-token-dit"
  run_dir: "runs/v2.0.0/phase2a/large_diffusion"
  precision: bf16-mixed  # fp32 master parameters, bf16-autocast forward (miniworld.training.precision); native = earlier

model:
  # the frozen trunk runs a uniform random 1..n_recycle_max recycles per micro-step in training (as in phase 1)
  train_recycle: random
  diffusion:
    token_dit_kind: bias_only
    dtype: bf16
    # bf16 diffusion module: no per-block activation checkpointing (it was the fp32 recipe's memory knob). With it every DiT block
    # re-runs its forward in backward: phase 2a L384 121.9 -> 108.0 ms per micro-step (peak 5.1 -> 20.2 GiB), 2b L768 336.9 -> 317.8 ms (10.7 -> 40.9 GiB).
    token_dit:
      n_checkpoint_segments: null
    # The engine's fused SWA atom DiT block (B200 bf16: the sm_100a kernels); off by default.
    atom_swa:
      fused_triton: true
      n_checkpoint_segments: null
