# Distogram-only MiniSWAModel — BioAI cluster, 8-GPU single-node real run.
#
# BioAI-cluster twin (data group points
# at BioAI paths (/data/psk6950/... + /data/shared/cssb_data/BioMol/lmdb/).
# The train group targets a single 8xH100 node: grad_accum_steps=32 so
#   eff batch = num_batch(1) * grad_accum(32) * world_size(8) = 256.
# Launch with torchrun --nproc_per_node=8.
#
# Model : ESMFold2-style SWA/3D-RoPE atom embedder (3 blocks) + 4 MiniMSAModule
#         + 48 MiniPairformer, global attention. compile:True -> CUDA-graph capture.
# Data  : AF3 Table 3 source mix, disordered_pdb weight=0.
# Kernels: trimul cute path requires miniworld-kernels @ perf/trimul-sm90-inference
#          (2ed6dd2) with quack 0.5.0 / cutlass-dsl 4.5.2 / flash-attn-4 b19.

defaults:
  - model: medium_swa_pf48
  - train: default
  - data: bioai_default
  - loss: distogram_only
  - _self_
