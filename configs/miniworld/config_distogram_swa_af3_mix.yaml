# Distogram-only MiniSWAModel training on the AF3 source mix (test run).
#
# Model : ESMFold2-style SWA/3D-RoPE atom embedder (3 blocks) + 4 MiniMSAModule
#         + 48 MiniPairformer, global attention (swa_window_size=1e6). Full
#         fwd+loss+bwd captured as a single CUDA graph on B200.
# Data  : AF3 Table 3 source mix, disordered_pdb weight=0 for this run.
# Train : compile:True → graph capture. 16-GPU (2 node) eff. batch 256.

defaults:
  - model: medium_distogram_swa_pf48
  - train: distogram_swa_af3_mix
  - data: full_train_af3_mix_no_disordered
  - loss: distogram_only
  - _self_
