# EDM distogram-DIFFUSION run — small trunk (pf4 / msa2 / no template) on the BioAI
# unified train_item + resources.lmdb dataloader. The distogram is GENERATED by
# denoising the bin-index image instead of a categorical head; n_recycle_max=1 ->
# a single conditioning trunk pass, the diffusion reverse process replaces recycling.
#
# {size}_{server}_{dataset} scheme: small model, BioAI paths, diffusion head.
# Data base = bioai_default (train_item_20210930 + resources_20210930 unified
# resolver + train_20210930_edge_node_reldate bias). The reldate-filtered item list
# is release-date consistent with the cif LMDB, so it avoids the missing-key crash
# the pre-reldate train_item.tsv hit. MSA capped at depth 512 at load (small-model
# throughput choice) on top of the d16k/d2k dbs — no separate d512 dbs needed.

defaults:
  - model: small_swa_pf4_notmpl_diffusion
  - train: default
  - data: bioai_default
  - loss: distogram_only
  - _self_

data:
  msa:
    # d512 throughput cap for the small model (reads 512 rows from the d16k/d2k dbs).
    max_msa_depth: 512
  # crop stays at bioai_default's 384/4096 — sigma_data/bin_center in the model
  # config were chosen for this crop + n_distogram_bins=96.

train:
  # The EDM loss samples random sigma/noise per step (host-side) -> NOT CUDA-graph
  # capturable. n_recycle_max=1 would otherwise auto-route to the cudagraph trainer,
  # so force the Fabric path and disable compile.
  force_trainer: fabric
  compile: False
  run_dir: "logs/distogram_diffusion_reldate/"
  comment: "EDM distogram-diffusion small pf4/msa2/notmpl — bioai reldate item, d512 MSA cap"
  # Must match data.msa.max_msa_depth (512), not the default 2048.
  bucket_msa_multiple: 512
