# Distogram-only MiniSWAModel training on the AF3 source mix — LOCAL-SERVER run.
#
# Twin of config_distogram_swa_af3_mix.yaml, differing only in the data group:
# it points at this box's data roots (see full_train_af3_mix_no_disordered_local).
# Model / train / loss are unchanged.
#
# Model : ESMFold2-style SWA/3D-RoPE atom embedder (3 blocks) + 4 MiniMSAModule
#         + 48 MiniPairformer, global attention (swa_window_size=1e6). Full
#         fwd+loss+bwd captured as a single CUDA graph on B200.
# Data  : AF3 Table 3 source mix, disordered_pdb weight=0 for this run.
# Train : compile:True → graph capture. grad_accum=16 assumes 16-GPU world
#         (2 node x 8 GPU) for eff. batch 256 — adjust grad_accum_steps if this
#         server launches with a different world size.

defaults:
  - model: medium_distogram_swa_pf48
  - train: distogram_swa_af3_mix
  - data: full_train_af3_mix_no_disordered_local
  - loss: distogram_only
  - _self_
