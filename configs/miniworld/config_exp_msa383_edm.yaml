# Experiment msa383 — plain AF3-like EDM diffuser.
# Run: scripts/run_miniworld_edm_only_train.py
#   torchrun --nnodes=1 --nproc_per_node=8 scripts/run_miniworld_edm_only_train.py train \
#     --ckpt epoch=0430.pt --no-ckpt-strict \
#     --config configs/miniworld/config_exp_msa383_edm.yaml \
#     --job-name exp-msa383-edm
defaults:
  - model: large_msa383
  - train: exp_msa383
  - data: full_train_balanced_v3_crop384
  - diffuser: edm
  - loss: wo_smoothlddt
  - _self_

train:
  comment: "exp msa383: only-msa, diff 3/8/3, freeze trunk, edm-af3like"
  run_dir: "logs/exp/msa383-edm/"
