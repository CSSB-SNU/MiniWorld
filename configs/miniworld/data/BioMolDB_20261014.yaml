# AF3-style mixed-source training config on the BioMolDB_20261014 release (cssb_h100 local paths).
# Same recipe as H100_default.yaml (source mix, crop, MSA, sampler); only the data location changes:
#   * every source is ONE cif / template / MSA lmdb in the release layout (no 80 distillation_long shards),
#   * resources.lmdb is written by scripts/build_resources_index_biomoldb.py (a single __meta__ record),
#   * train_item_20210930.tsv is reused: a 2% sample of its rows (pdb, protein_monomer,
#     short_protein_monomer, disordered_pdb) all resolve in the new cif lmdbs,
#   * PDB MSAs are the uncapped a3m.lmdb (H100_default used a3m_d16k); distillation MSAs stay depth <= 2000.
# The catalog cache is rebuilt on the first run (26M train_item rows).

train_db:
  ccd_preprocessed_path: /home/psk6950/data/CCD/preprocessed_CCD.lmdb

  source_weights:
    pdb: 0.5
    disordered_pdb: 0.02
    protein_monomer: 0.495
    short_protein_monomer: 0.005

  sample_with_replacement: true
  manifest_validation: paths
  catalog_cache_path: /home/psk6950/data/BioMolDB_20261014/catalog_trainitem_no_disordered_unified.arrow

  train_item_path: /home/psk6950/data/filtering/edge_node/train_item_20210930.tsv
  resources_index_path: /home/psk6950/data/BioMolDB_20261014/metadata/resources.lmdb
  resources_base: /home/psk6950/data/BioMolDB_20261014/

  pdb:
    cif_db_path: /home/psk6950/data/BioMolDB_20261014/lmdb/pdb/cif_attached/cif_pdb_attached_train_20210930_res9_chain300.lmdb
    a3m_db_path: /home/psk6950/data/BioMolDB_20261014/lmdb/pdb/msa/a3m.lmdb
    a3m_rna_db_path: /home/psk6950/data/BioMolDB_20261014/lmdb/pdb/msa/msa_rna.lmdb
    template_db_path: /home/psk6950/data/BioMolDB_20261014/lmdb/chain/template/template.lmdb
    edge_id_to_bias_path: /home/psk6950/data/BioMol/metadata/train_20210930_edge_node_reldate.tsv
    ccd_preprocessed_path: /home/psk6950/data/CCD/preprocessed_CCD.lmdb

  distillation_sources:
    - name: protein_monomer
      cif_db_path: /home/psk6950/data/BioMolDB_20261014/lmdb/distillation_long/cif_attached/cif_long_attached.lmdb
      template_db_path: /home/psk6950/data/BioMolDB_20261014/lmdb/distillation_long/template/template_topn_long.lmdb
      chain_ids: ["1"]
      lookup_mode: record_id
      a3m_db_paths:
        - /home/psk6950/data/BioMolDB_20261014/lmdb/distillation_long/msa/msa_long_d2k.lmdb

    - name: short_protein_monomer
      cif_db_path: /home/psk6950/data/BioMolDB_20261014/lmdb/distillation_short/cif_attached/cif_short_attached.lmdb
      template_db_path: /home/psk6950/data/BioMolDB_20261014/lmdb/distillation_short/template/template_topn_short.lmdb
      chain_ids: ["1"]
      lookup_mode: record_id
      a3m_db_paths:
        - /home/psk6950/data/BioMolDB_20261014/lmdb/distillation_short/msa/msa_short_d2k.lmdb

    - name: disordered_pdb
      cif_db_path: /home/psk6950/data/BioMolDB_20261014/lmdb/distillation_disordered/cif_attached/cif_disordered_attached.lmdb
      template_db_path: /home/psk6950/data/BioMolDB_20261014/lmdb/distillation_disordered/template/template_disordered.lmdb
      chain_ids: ["1"]
      lookup_mode: record_id
      a3m_db_paths:
        - /home/psk6950/data/BioMolDB_20261014/lmdb/distillation_disordered/msa/msa_disordered_d2k.lmdb

crop:
  max_tokens: 384
  max_atoms: 4096
  min_segment_size: 1
  max_segment_size: 41

  monomer_only: false
  remain_invalid_tokens: false

  bucket_msa_size: 128
  bucket_token_size: 128
  bucket_atom_size: 1024
  chain_crop_prob: 0.5

template:
  n_templates: 4

msa:
  n_samples: 1
  max_msa_depth: 2048
  missing_policy: query
  pairing_mode: no_pairing  # skip species pairing (_pairing_MSAs loop)
  # sample_depth default is now "uniform" (AF3-style k ~ Uniform[1, min(n, 2048)]).
  # Set to "fixed" here to override if you want legacy always-max sampling.

tokenizer:
  # Consistent AF3-style tokenization: canonical polymer residues -> 1 token per
  # residue, ligands / non-canonical -> 1 token per atom (vectorized atom_tokenize).
  # Replaces the per-atom-loop `dynamic_tokenize`, which was ~56% of per-item time.
  level: atom

# Weighted-PDB internal item weighting (unchanged; per user request).
sampler:
  protein_protein: 25.0
  protein_ligand: 25
  protein_dna: 10
  protein_rna: 10
  antibody_protein: 15
  dna_dna: 5
  rna_rna: 5
  dna_rna: 0.5
  antibody_antibody: 0.5
  antibody_ligand: 1.0
  na_ligand: 1.0
  etc_interface: 1.0
  sole: 1.0
