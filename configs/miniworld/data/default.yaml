DB_PATH: /home/psk6950/data/
train_db:
  cif_db_path: ${..DB_PATH}/BioMolDBv2_2024Oct21/cif_20210930_res9.lmdb
  a3m_db_path: ${..DB_PATH}/BioMolDBv2_2024Oct21/slim_a3m.lmdb
  edge_id_to_cif_ids_path: ${..DB_PATH}/BioMolDBv2_2024Oct21/metadata/graph_split_20210930_res9/train_edges.tsv
  load_all_msa: False
  
valid_db:
  cif_db_path: ${..DB_PATH}/BioMolDBv2_2024Oct21/cif_20210930_res9.lmdb
  a3m_db_path: ${..DB_PATH}/BioMolDBv2_2024Oct21/slim_a3m.lmdb
  edge_id_to_cif_ids_path: ${..DB_PATH}/BioMolDBv2_2024Oct21/metadata/graph_split_20210930_res9/valid_edges.tsv
  load_all_msa: False

edge_weight:
  PP_edge: 1.0
  PN_edge: 1.0
  PL_edge: 0.666
  NN_edge: 1.0
  NL_edge: 0.666
  LL_edge: 0.0
  eta: 0.9
  decay: 0.999
  init_score: 1.0
  init_freq: 0.0
  device: "cpu"

crop:
  contiguous_prob: 0.2
  spatial_prob: 0.4
  interface_prob: 0.0
  interface_simple_prob: 0.4
  crop_length: 384


msa:
  n_samples: 1
  max_msa_depth: 384
  missing_policy: "query"

tokenizer:
  level: "residue"
