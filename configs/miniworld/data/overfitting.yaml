DB_PATH: /public_data02/
train_db:
  cif_db_path: ${..DB_PATH}/BioMolDB_20260224/cif_attached_train_20260224_res9_chain300.lmdb
  a3m_db_path: ${..DB_PATH}/BioMolDB_20260224/a3m.lmdb
  edge_id_to_bias_path: ${..DB_PATH}/BioMolDB_20260224/metadata/train_overfitting.tsv
  template_db_path: ${..DB_PATH}/BioMolDB_20260224/template.lmdb
  ccd_preprocessed_path: ${..DB_PATH}/CCD/preprocessed_CCD.lmdb

crop:
  max_tokens: 384
  max_atoms: 4096
  min_segment_size: 1
  max_segment_size: 41

  monomer_only: false
  remain_invalid_tokens: false

  bucket_msa_size: 128
  bucket_token_size: 128
  bucket_atom_size: 1024

msa:
  n_samples: 1
  max_msa_depth: 384
  missing_policy: "query"


tokenizer:
  level: "dynamic"
  dynamic_tokenization:
    minimum_resolution_ratio: [0.2, 0.6, 0.2]

    sigma_flat_prob: 0.3
    sigma_min:  4.0
    sigma_max: 8.0

sampler:
  antibody_antibody: 0.3
  antibody_nucleic_acid: 1.0
  antibody_protein: 15.0

  DNA_DNA: 2.0
  DNA_RNA: 2.5
  RNA_RNA: 2.0
  NA_NA: 1.0

  protein_nucleic_acid: 20.0
  protein_protein: 45.0
  protein_ligand: 10.0

  ligand_ligand: 0.2

  etc_interface: 0.5
  sole: 0.5
