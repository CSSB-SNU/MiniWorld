# H100_default.yaml on the B200 server: the same data, files and settings, other paths only.
#   H100 /home/psk6950/data/BioMol/  -> /NHNHOME/WORKSPACE/26mohw002_A/psk6950/BioMol/  (all 369 files, sizes checked 2026-10-02)
#   H100 /home/psk6950/data/         -> /NHNHOME/WORKSPACE/26mohw002_A/psk6950/data/   (CCD, train_item list, catalog cache)
# Select it on B200 with the override  data=B200_default  (every phase config defaults to H100_default).
#
# catalog_cache_path: the H100 catalog with its DB paths rewritten to these paths and its fingerprint
# recomputed for this config (scripts/remap_catalog_cache.py); the loader treats it exactly like a
# cache built here. Keep the rest of this file in step with H100_default.yaml.

train_db:
  ccd_preprocessed_path: /NHNHOME/WORKSPACE/26mohw002_A/psk6950/data/CCD/preprocessed_CCD.lmdb

  # AF3 Table 3 (pre-training) weights; loader normalizes across active sources.
  # rna / disordered_pdb are not declared below, so their train_item.tsv rows are
  # skipped at load (read_train_items). Keys resolve from the CIF: msa <- seq_id,
  # template <- {RECORD}_{auth_chain}; cif <- record_id.
  source_weights:
    pdb: 0.5
    disordered_pdb: 0.02
    protein_monomer: 0.495
    short_protein_monomer: 0.005

  sample_with_replacement: true
  manifest_validation: paths
  # Rebuilt for the unified resolver (records carry empty msa_db_paths; the exact
  # shard is resolved at runtime by seq_id via resources_index_path).
  catalog_cache_path: /NHNHOME/WORKSPACE/26mohw002_A/psk6950/data/BioMolDB_20260224/catalog_trainitem_no_disordered_bioai_unified_b200.arrow

  # Unified item list (source-tagged edge_node). Routes each row to its source's
  # LMDBs (pdb below + distillation_sources) and derives AF3-style raw weights.
  train_item_path: /NHNHOME/WORKSPACE/26mohw002_A/psk6950/data/filtering/edge_node/train_item_20210930.tsv
  # Single location authority (built by StructCooker
  # scripts/maintenance/build_resources_index.py): cif/template per source,
  # exact msa shard by seq_id (no runtime shard scan).
  resources_index_path: /NHNHOME/WORKSPACE/26mohw002_A/psk6950/BioMol/metadata/resources_20210930.lmdb
  # index __meta__ base is the bioai mount (/data/shared/cssb_data/BioMol/); override
  # to this server's BioMol root so the base-relative shard paths resolve on B200.
  resources_base: /NHNHOME/WORKSPACE/26mohw002_A/psk6950/BioMol/

  pdb:
    cif_db_path: /NHNHOME/WORKSPACE/26mohw002_A/psk6950/BioMol/lmdb/pdb/cif/cif_pdb_attached_train_20210930_res9_chain300.lmdb
    a3m_db_path: /NHNHOME/WORKSPACE/26mohw002_A/psk6950/BioMol/lmdb/pdb/msa/a3m_d16k.lmdb
    a3m_rna_db_path: /NHNHOME/WORKSPACE/26mohw002_A/psk6950/BioMol/lmdb/pdb/msa/msa_rna_pdb_d2k_shard0.lmdb
    template_db_path: /NHNHOME/WORKSPACE/26mohw002_A/psk6950/BioMol/lmdb/pdb/template/template.lmdb
    edge_id_to_bias_path: /NHNHOME/WORKSPACE/26mohw002_A/psk6950/BioMol/metadata/train_20210930_edge_node_reldate.tsv
    ccd_preprocessed_path: /NHNHOME/WORKSPACE/26mohw002_A/psk6950/data/CCD/preprocessed_CCD.lmdb

  distillation_sources:
    - name: protein_monomer
      cif_db_path: /NHNHOME/WORKSPACE/26mohw002_A/psk6950/BioMol/lmdb/distillation_long/cif/cif_long_attached.lmdb
      template_db_path: /NHNHOME/WORKSPACE/26mohw002_A/psk6950/BioMol/lmdb/distillation_long/template/template_topn_long.lmdb
      chain_ids: ["1"]
      lookup_mode: record_id
      # 80 rekeyed shards, NOT a merged db: merging 2.4T single-threaded on GPFS
      # is ~7 days (IO-bound). load_raw_data caches envs, so trying all 80 per
      # lookup is cheap B-tree misses (~us) after warmup.
      a3m_db_paths:
        - /NHNHOME/WORKSPACE/26mohw002_A/psk6950/BioMol/lmdb/distillation_long/msa/msa_long_d2k_seqid_shard0.lmdb
        - /NHNHOME/WORKSPACE/26mohw002_A/psk6950/BioMol/lmdb/distillation_long/msa/msa_long_d2k_seqid_shard1.lmdb
