# AF3-style mixed-source training config — DISORDERED_PDB DISABLED variant.
# LOCAL-SERVER paths (psk6950 box). Twin of full_train_af3_mix_no_disordered.yaml
# with data roots remapped:
#   .../data/v2/                 -> /home/psk6950/data/BioMolDB_20260224/
#   .../data/CCD/                -> /home/psk6950/data/CCD/
#   .../data/distillation/lmdb/  -> /home/psk6950/data/openfold_distillation/lmdb/
#
# Test-run twin of full_train_af3_mix.yaml where disordered_pdb has
# source_weights = 0.0 (never sampled). Its DistillationSourceConfig is
# kept in ``distillation_sources`` so the ~28k records still get registered
# into dataset.items during __init__, but _source_balanced_weights masks
# them out of the WeightedSampler.
#
# Source weights come from AlphaFold 3 Supplementary Table 3 (pre-training row
# subset). RNA distillation is dropped (user request → 0). Transcription-factor
# sets are fine-tune only and not included here.
#
# Within the "pdb" source, PDB item weighting is unchanged — it still uses the
# legacy edge_id_to_bias TSV + SamplerConfig type weights below (protein_protein
# 25, protein_ligand 25, ...). AF3's beta_r/alpha_r formula from Eq. 1 is NOT
# applied.
#
# max_msa_depth = 2048 (matches the pre-computed msa_long_d2k_* shard depth cap).
# missing_policy = query so absent MSAs fall back to the query sequence.


train_db:
  ccd_preprocessed_path: /home/psk6950/data/CCD/preprocessed_CCD.lmdb

  # AF3 Table 3 (pre-training) weights; loader normalizes across active sources.
  # disordered_pdb is at 0.0 for this test run — items still catalog'd, never sampled.
  source_weights:
    pdb: 0.5
    disordered_pdb: 0.0
    protein_monomer: 0.495
    short_protein_monomer: 0.005

  sample_with_replacement: true
  manifest_validation: paths
  catalog_cache_path: /home/psk6950/data/openfold_distillation/catalog_af3mix_no_disordered_local.arrow

  pdb:
    cif_db_path: /home/psk6950/data/BioMolDB_20260224/cif_attached_train_20260224_res9_chain300.lmdb
    a3m_db_path: /home/psk6950/data/BioMolDB_20260224/a3m_16k.lmdb
    template_db_path: /home/psk6950/data/BioMolDB_20260224/template.lmdb
    edge_id_to_bias_path: /home/psk6950/data/BioMolDB_20260224/metadata/train_20260224_edge_node.tsv
    ccd_preprocessed_path: /home/psk6950/data/CCD/preprocessed_CCD.lmdb

  distillation_sources:
    - name: protein_monomer
      cif_db_path: /home/psk6950/data/openfold_distillation/lmdb/cif_long_attached.lmdb
      template_db_path: /home/psk6950/data/openfold_distillation/lmdb/template_topn_long.lmdb
      chain_ids: ["1"]
      lookup_mode: record_id
      a3m_db_paths:
        - /home/psk6950/data/openfold_distillation/lmdb/msa_long_d2k_shard0.lmdb
        - /home/psk6950/data/openfold_distillation/lmdb/msa_long_d2k_shard1.lmdb
        - /home/psk6950/data/openfold_distillation/lmdb/msa_long_d2k_shard2.lmdb
