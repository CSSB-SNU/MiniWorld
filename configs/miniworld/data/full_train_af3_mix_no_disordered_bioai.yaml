# AF3-style mixed-source training config — DISORDERED_PDB DISABLED variant.
# BioAI-cluster paths. Twin of full_train_af3_mix_no_disordered_local.yaml
# with data roots remapped to this server:
#   /home/psk6950/data/BioMolDB_20260224/       -> /data/psk6950/BioMolDB_20260224/
#   /home/psk6950/data/CCD/preprocessed_CCD.lmdb-> /data/psk6950/CCD/preprocessed_CCD.lmdb
#   /home/psk6950/data/openfold_distillation/lmdb/ -> /data/shared/cssb_data/BioMol/lmdb/
# NOTE: BioAI ships a single msa_long_d2k.lmdb (2.4T), not the 80 msa_long_d2k_shard*
# files the local box used — same d2k (depth-2048) data, so the a3m list has one entry.
#
# Test-run twin of full_train_af3_mix.yaml where disordered_pdb has
# source_weights = 0.0 (never sampled). Its DistillationSourceConfig is
# kept in ``distillation_sources`` so the ~28k records still get registered
# into dataset.items during __init__, but _source_balanced_weights masks
# them out of the WeightedSampler.
#
# Source weights come from AlphaFold 3 Supplementary Table 3 (pre-training row
# subset). RNA distillation is dropped (user request → 0). Transcription-factor
# sets are fine-tune only and not included here.
#
# Within the "pdb" source, PDB item weighting is unchanged — it still uses the
# legacy edge_id_to_bias TSV + SamplerConfig type weights below (protein_protein
# 25, protein_ligand 25, ...). AF3's beta_r/alpha_r formula from Eq. 1 is NOT
# applied.
#
# max_msa_depth = 2048 (matches the msa_long_d2k depth cap).
# missing_policy = query so absent MSAs fall back to the query sequence.


train_db:
  ccd_preprocessed_path: /data/psk6950/CCD/preprocessed_CCD.lmdb

  # AF3 Table 3 (pre-training) weights; loader normalizes across active sources.
  # rna / disordered_pdb are not declared below, so their train_item.tsv rows are
  # skipped at load (read_train_items). Keys resolve from the CIF: msa <- seq_id,
  # template <- {RECORD}_{auth_chain}; cif <- record_id.
  source_weights:
    pdb: 0.5
    disordered_pdb: 0.02
    protein_monomer: 0.495
    short_protein_monomer: 0.005

  sample_with_replacement: true
  manifest_validation: paths
  catalog_cache_path: /data/psk6950/BioMolDB_20260224/catalog_trainitem_no_disordered_bioai.arrow

  # Unified item list (source-tagged edge_node). Routes each row to its source's
  # LMDBs (pdb below + distillation_sources) and derives AF3-style raw weights.
  train_item_path: /data/psk6950/filtering/edge_node/train_item.tsv

  pdb:
    cif_db_path: /data/shared/cssb_data/BioMol/lmdb/pdb/cif/cif_pdb_attached_train_20210930_res9_residue10k_chain300.lmdb
    a3m_db_path: /data/shared/cssb_data/BioMol/lmdb/pdb/msa/a3m.lmdb
    a3m_rna_db_path: /data/shared/cssb_data/BioMol/lmdb/pdb/msa/msa_rna_pdb_shard0.lmdb
    template_db_path: /data/shared/cssb_data/BioMol/lmdb/pdb/template/template.lmdb
    edge_id_to_bias_path: /data/psk6950/filtering/edge_node/pdb_edge_node.tsv
    ccd_preprocessed_path: /data/psk6950/CCD/preprocessed_CCD.lmdb

  distillation_sources:
    - name: protein_monomer
      cif_db_path: /data/shared/cssb_data/BioMol/lmdb/distillation_long/cif/cif_long_attached.lmdb
      template_db_path: /data/shared/cssb_data/BioMol/lmdb/distillation_long/template/template_topn_long.lmdb
      chain_ids: ["1"]
      lookup_mode: record_id
      # 80 rekeyed shards, NOT a merged db: merging 2.4T single-threaded on GPFS
      # is ~7 days (IO-bound). load_raw_data caches envs, so trying all 80 per
      # lookup is cheap B-tree misses (~us) after warmup.
      a3m_db_paths:
        - /data/shared/cssb_data/BioMol/lmdb/distillation_long/msa/msa_long_d2k_seqid_shard0.lmdb
        - /data/shared/cssb_data/BioMol/lmdb/distillation_long/msa/msa_long_d2k_seqid_shard1.lmdb
        - /data/shared/cssb_data/BioMol/lmdb/distillation_long/msa/msa_long_d2k_seqid_shard2.lmdb
        - /data/shared/cssb_data/BioMol/lmdb/distillation_long/msa/msa_long_d2k_seqid_shard3.lmdb
