# Sampling/inference data config for epoch=0465.pt (no-single QK-norm + bf16 EDM),
# which was trained with config_exp_msa3_24_3_no_single_qknorm_bf16_edm.yaml on
# data=full_train_balanced_v3_crop384_atom_gap.
#
# IMPORTANT: this checkpoint's FROZEN trunk is in-distribution ONLY for the
# atom-tokenization + missing_policy=gap pipeline (see the atom_gap config /
# rank-collapse analysis). The generic local_sample_edm.yaml uses
# tokenizer.level=dynamic + missing_policy=query, which is OUT-of-distribution
# for this checkpoint and degrades distogram/conditioning quality. So this file
# = local_sample_edm.yaml DB paths (which exist on the cssb node) + the atom/gap
# pipeline from full_train_balanced_v3_crop384_atom_gap.yaml.
train_db:
  cif_db_path: /home/psk6950/data/BioMolDB_20260224/cif_attached_train_20260224_res9_chain300.lmdb
  a3m_db_path: /home/psk6950/data/BioMolDB_20260224/a3m_16k.lmdb
  edge_id_to_bias_path: /home/psk6950/data/temp/metadata/train_20260224_edge_node.tsv
  template_db_path: /home/psk6950/data/BioMolDB_20260224/template.lmdb
  ccd_preprocessed_path: /home/psk6950/data/CCD/preprocessed_CCD.lmdb

crop:
  max_tokens: 384
  max_atoms: 4096
  min_segment_size: 1
  max_segment_size: 41

  monomer_only: false
  remain_invalid_tokens: false

  bucket_msa_size: 128
  bucket_token_size: 128
  bucket_atom_size: 1024
  chain_crop_prob: 0.5

msa:
  n_samples: 1
  max_msa_depth: 384
  missing_policy: "gap"

tokenizer:
  level: "atom"

sampler:
  protein_protein: 25.0
  protein_ligand: 25
  protein_dna: 10
  protein_rna: 10
  antibody_protein: 15
  dna_dna: 5
  rna_rna: 5
  dna_rna: 0.5
  antibody_antibody: 0.5
  antibody_ligand: 1.0
  na_ligand: 1.0
  etc_interface: 1.0
  sole: 1.0
