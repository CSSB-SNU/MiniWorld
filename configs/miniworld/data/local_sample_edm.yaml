# Local mirror of full_train_balanced_v3_crop384.yaml for sampling/inference on
# the cssb cluster. Only the DB paths differ: the original /NHNHOME/... paths do
# not exist here, so they are remapped to /home/psk6950/data/ (verified present).
#   /NHNHOME/WORKSPACE/0226010152_A/data/  ->  /home/psk6950/data/BioMolDB_20260224/
#   edge tsv                               ->  /home/psk6950/data/temp/metadata/
#   CCD                                    ->  /home/psk6950/data/CCD/
# crop / tokenizer / sampler are kept identical to the training config so the
# data pipeline matches what epoch=0440.pt was trained on.
train_db:
  cif_db_path: /home/psk6950/data/BioMolDB_20260224/cif_attached_train_20260224_res9_chain300.lmdb
  a3m_db_path: /home/psk6950/data/BioMolDB_20260224/a3m_16k.lmdb
  edge_id_to_bias_path: /home/psk6950/data/temp/metadata/train_20260224_edge_node.tsv
  template_db_path: /home/psk6950/data/BioMolDB_20260224/template.lmdb
  ccd_preprocessed_path: /home/psk6950/data/CCD/preprocessed_CCD.lmdb

crop:
  max_tokens: 384
  max_atoms: 4096
  min_segment_size: 1
  max_segment_size: 41

  monomer_only: false
  remain_invalid_tokens: false

  bucket_msa_size: 128
  bucket_token_size: 128
  bucket_atom_size: 1024
  chain_crop_prob: 0.5

msa:
  n_samples: 1
  max_msa_depth: 384
  missing_policy: "query"


tokenizer:
  level: "dynamic"
  dynamic_tokenization:
    minimum_resolution_ratio: [0.2, 0.6, 0.2]

    sigma_flat_prob: 0.0
    sigma_min:  4.0
    sigma_max: 8.0

sampler:
  protein_protein: 25.0
  protein_ligand: 25
  protein_dna: 10
  protein_rna: 10
  antibody_protein: 15
  dna_dna: 5
  rna_rna: 5
  dna_rna: 0.5
  antibody_antibody: 0.5
  antibody_ligand: 1.0
  na_ligand: 1.0
  etc_interface: 1.0
  sole: 1.0
