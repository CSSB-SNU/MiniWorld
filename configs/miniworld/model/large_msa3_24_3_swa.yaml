# Experiment variant of large_msa3_24_3 with ESMFold2-style atom attention:
# sliding-window local attention + 3D RoPE + QK-norm, and NO pair bias at the
# atom level. Only diffusion.atom_swa differs from large_msa3_24_3.yaml; the
# trunk and token_dit are identical so this is a clean A/B against that config.
#
# The atom DIT (atom_dit, n_head=4, d_single_atom=128 -> head_dim=32) is shared
# by the atom encoder AND decoder, so both get the SWA treatment.
shared:
  d_single: 384
  d_single_atom: 128
  d_single_token_input: 449
  d_single_token_diffusion: 768
  d_pair: 128
  d_pair_atom: 16

  d_time: 256
  r_max: 32
  s_max: 2
  n_distogram_bins: 64
  num_res_class: 32
  implementation: triton
  use_checkpoint: False


input_feat_embbeder:
  n_block: 3
  n_checkpoint_segments: null
  d_single: ${..shared.d_single_atom}
  d_cond: ${..shared.d_single_atom}
  d_pair: ${..shared.d_pair_atom}
  n_head: 4
  implementation: triton

trunk:
  n_recycle_max: 4
  use_template: False
  use_contact: False
  pairformer:
    n_block: 48
    n_checkpoint_segments: null

    d_single: ${...shared.d_single}
    d_pair: ${...shared.d_pair}
    d_hidden_tri_multi: 128
    d_hidden_tri_attention: 32
    n_head_tri_attention: 4
    n_head_attention: 16
    p_drop: 0.25
    use_single: True
    use_self_attention: False
    implementation: cuequivariance

  msa_module:
    n_block: 4

    d_msa: 64
    d_pair: ${...shared.d_pair}
    d_single_token_input: ${...shared.d_single_token_input}
    d_hidden_msa: 32
    d_hidden_tri_multi: 128
    d_hidden_tri_attention: 32
    n_head_tri_attention: 4
    n_head_attention: 16
    p_drop_msa: 0.15
    p_drop: 0.25
    use_self_attention: False
    n_checkpoint_segments: null

    implementation: cuequivariance

  # Kept for schema completeness; unused because trunk.use_template=False.
  template_embedder:
    d_pair_template_input: 4
    d_pair: 128
    d_hidden: 128
    n_head_tri_attention: 4
    p_drop: 0.25
    use_self_attention: False
    implementation: cuequivariance
    n_block: 2


diffusion:
  atom_dit:
    n_block: 3
    n_checkpoint_segments: null
    d_single: ${...shared.d_single_atom}
    d_cond: ${...shared.d_single_atom}
    d_pair: ${...shared.d_pair_atom}
    n_head: 4
    implementation: triton
    kernel_type: "compute_efficient"
  token_dit:
    n_block: 24
    n_checkpoint_segments: null
    d_single: ${...shared.d_single_token_diffusion}
    d_cond: ${...shared.d_single}
    d_pair: ${...shared.d_pair}
    n_head: 24
    implementation: triton
    kernel_type: "compute_efficient"
  dit_cond:
    n_expand: 2
    n_blocks: 2
  # ESMFold2-style atom attention (opt-in). head_dim = 128/4 = 32, so
  # 3*2 spatial + 10 uid = 16 = head_dim/2 fits the RoPE exactly.
  atom_swa:
    enabled: True
    swa_window_size: 128
    backend: flash           # FlashAttention-4 (B200/sm_100). flex | sdpa | flash
    expansion_ratio: 2
    n_spatial_rope_pairs_per_axis: 2
    n_uid_rope_pairs: 10
    spatial_rope_base_frequency: 20.0
    uid_rope_base_frequency: 10000.0
