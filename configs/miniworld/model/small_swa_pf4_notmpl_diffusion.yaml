# EDM distogram-DIFFUSION variant of small_swa_pf8_notmpl:
#   - NO template embedder (use_template: false)
#   - 2 MSA module blocks, 4 pairformer blocks (pf4 — lighter than pf8 base)
#   - n_recycle_max: 1  -> the trunk is a SINGLE conditioning pass; the iterative
#     refinement that recycling did is now the diffusion reverse process.
#   - trunk.diffusion set -> the distogram is GENERATED by denoising the bin-index
#     image (EDM). The TRUNK itself is the denoiser: a Linear encoder injects the
#     noised bin image into the pair input, a Linear decoder reads it back out.
#   - n_distogram_bins: 96 (diffusion target resolution; sigma_data/bin_center below
#     were measured at THIS bin count — re-measure if you change it).
# NOTE: n_recycle_max=1 would normally route to the cudagraph trainer, but the EDM
# loss samples random sigma/noise per step (host-side), which is not CUDA-graph
# capturable -> the top config forces train.force_trainer=fabric + compile=False.

shared:
  d_single: 384
  d_single_atom: 128
  d_single_token_input: 449
  d_pair: 128
  d_pair_atom: 16

  d_time: 256
  r_max: 32
  s_max: 2
  n_distogram_bins: 96
  num_res_class: 32
  implementation: miniworld_engine
  use_checkpoint: False


input_feat_embbeder:
  n_block: 3
  n_checkpoint_segments: null
  d_single: ${..shared.d_single_atom}
  d_cond: ${..shared.d_single_atom}
  d_pair: ${..shared.d_pair_atom}
  n_head: 4
  implementation: miniworld_engine


atom_swa:
  enabled: true
  swa_window_size: 1000000
  backend: flash
  expansion_ratio: 2
  n_spatial_rope_pairs_per_axis: 2
  n_uid_rope_pairs: 10
  spatial_rope_base_frequency: 20.0
  uid_rope_base_frequency: 10000.0


trunk:
  n_recycle_max: 1
  use_template: false

  # EDM distogram-diffusion head. The TRUNK itself is the denoiser (no separate
  # network): a Linear encoder injects the noised distogram bin image into the
  # trunk's pair input, and a Linear decoder reads the denoised image out. So this
  # block only carries the EDM machinery.
  diffusion:
    # Centre on the MEASURED mean bin so x0 = bin - bin_center is ~zero-mean (EDM
    # assumes zero-mean); NOT (D-1)/2, since the distogram is far-heavy. Measured
    # D=96 @ crop=768 on the TRAINING MIX; reused for crop=384 training (crop
    # dependence of sigma_data is mild and it is only a preconditioning normaliser).
    bin_center: 85.70
    num_sampling_steps: 24     # inference reverse steps (compute/quality knob)
    scheduler:
      method: AF3
      P_mean: -1.2
      P_std: 1.5
      # Measured std of the centred bin image, D=96 bins, CB target, TRAINING MIX
      # (pdb0.5/monomer0.495/short0.005/disordered0.02) @ crop=768, 1000 structs
      # (scripts/measure_distogram_sigma_data.py). Crop-dependent; MUST match crop
      # AND n_distogram_bins (=96) — re-measure if either changes.
      sigma_data: 18.90
      sigma_max: 160.0
      sigma_min: 4.0e-4
      rho: 7.0
      use_time_augmentation: true

  pairformer:
    n_block: 4
    n_checkpoint_segments: null

    d_single: ${...shared.d_single}
    d_pair: ${...shared.d_pair}
    n_head_tri_attention: 4
    n_head_attention: 16
    p_drop: 0.25
    use_single: False
    use_self_attention: False
    implementation: miniworld_engine

  msa_module:
    n_block: 2

    d_msa: 64
    d_pair: ${...shared.d_pair}
    d_single_token_input: ${...shared.d_single_token_input}
    d_hidden_msa: 32
    d_hidden_tri_multi: 128
    d_hidden_tri_attention: 32
    n_head_tri_attention: 4
    n_head_attention: 16
    p_drop_msa: 0.15
    p_drop: 0.25
    use_self_attention: False
    n_checkpoint_segments: null

    implementation: miniworld_engine
