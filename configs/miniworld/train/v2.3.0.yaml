comment: "miniworld 2.3.0 — Bug A retrain, train full diffusion_module, freeze trunk, crop 384|4096, warm-start from 2.2.4 epoch=1095"
run_dir: "logs/miniworld v2.3.0/"

# Fine-tuning from the 2.2.4 checkpoint after the Bug A pair-cond gather fix
# (commit fe187eb). The buggy gather lived in
# ``diffusion_module.atom_attention_encoder``, but the corrupted
# ``atom_pair`` feeds the encoder's atom_transformer whose output then
# propagates through the rest of the diffusion module — so the whole
# diffusion module is potentially miscalibrated. Train all of it.
#
# The trunk (input embedder, msa, pairformer, templates, distogram,
# recycle projections) produces token-level reps and never sees
# ``atom_pair``; its weights remain valid, so we freeze it.

# Training arguments
# num_epoch is an absolute counter that resumes from the checkpoint's epoch
# (1095 for 2.2.4/epoch=1095.pt). 1400 gives ~305 epochs of fine-tune.
num_batch: 1
num_epoch: 1400
max_lr: 3e-4
min_lr: 1e-5
warmup_steps: 200
decay_steps: 1e4
self_condition: False
compile: True
num_augment: 32
train_item: 25600
valid_item: 640

# Validation arguments
save_freq: 5
eval_freq: 20000
eval_sample_num: 1
eval_input_num: 50
eval_timesteps: 100
grad_clip_max_norm: 1.0
grad_accum_steps: 16
optimizer: "Adam"

num_workers: 4
prefetch_factor: 2
use_ema: True
ema_decay: 0.999
bce_pos_weight: 2.0
long_range_sigmoid_amp: 3.0

bucket_msa_multiple: 128
bucket_token_multiple: 128
bucket_atom_multiple: 1024

verbose: False
use_wandb: True
wandb_project: "MiniWorld"

# ---------------------------------------------------------------------------
# Param policy — Bug A retrain
#
# Patterns are prefix-glob (``name == pat`` OR ``name.startswith(pat + ".")``).
# Naming a module covers every parameter beneath it. Each param belongs to
# exactly one category; overlapping patterns across categories raise at
# startup. Patterns that match zero params also raise (typo guard).
#
# default=load_existing: any param not listed below is warm-started from
# the checkpoint and continues training. With the trunk frozen below,
# this default applies to the entire ``diffusion_module`` (minus the
# reinit'd projection).
# ---------------------------------------------------------------------------
param_policy:
  enabled: True
  default: load_existing

  # The pair-cond projection ``token_pair_to_atom_pair`` sits immediately
  # upstream of the (formerly buggy) gather. Its outputs were consumed in a
  # collapsed-diagonal way during the pre-fix training, so its weights no
  # longer match the new pair-wise gather semantics.
  reinit:
    - diffusion_module.atom_attention_encoder.token_pair_to_atom_pair

  # Freeze the trunk: it produces token-level reps for the diffusion
  # module and never touches ``atom_pair`` directly, so its weights are
  # unaffected by the Bug A semantics change.
  freeze:
    - input_feature_embedder
    - add_pair_recycle
    - add_single_recycle
    - proj_contact
    - msa_module
    - temp_embedder
    - pairformer_blocks
    - distogram_head
