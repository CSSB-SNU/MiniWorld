    edge_id_to_cif_ids_path: /home/psk6950/data/BioMolDBv2_2024Oct21/metadata/graph_edges.tsv
    
  valid_DB:
    cif_db_path: /home/psk6950/data/BioMolDBv2_2024Oct21/cif_20210930_res9.lmdb
    a3m_db_path: /home/psk6950/data/BioMolDBv2_2024Oct21/a3m.lmdb
    edge_id_to_cif_ids_path: /home/psk6950/data/BioMolDBv2_2024Oct21/metadata/graph_split_20210930_res9/valid_edges.tsv

  edge_weight:
    PP_edge: 1.0
    PN_edge: 1.0
    PL_edge: 0.666
    NN_edge: 1.0
    NL_edge: 0.666
    LL_edge: 0.0
    eta: 0.9
    decay: 0.999
    init_score: 1.0
    init_freq: 0.0
    device: "cpu"


  crop:
    contiguous_prob: 0.2
    spatial_prob: 0.4
    interface_prob: 0.4
    crop_length: 384

  msa:
    n_samples: 1
    max_msa_depth: 384

experiment:
  comment: pairformer 4, augment 16

  # Training arguments
  num_batch: 1
  num_epoch: 1000
  # max_lr: 1.8e-3
  max_lr: 1e-4
  min_lr: 1e-4
  warmup_steps: 0
  decay_steps: 5e4
  self_condition: False
  compile: False
  num_augment: 16
  train_item: 2400
  valid_item: 640

  # Validation arguments
  eval_freq: 10
  eval_sample_num: 1
  eval_input_num: 50
  eval_timesteps: 100
  grad_clip_max_norm: 10.0
  grad_accum_steps: 1
  num_workers: 4
  prefetch_factor: 8
