data:
  data_pkl_path: ./data/dataset.pkl
  input_dir_path: /home/public_data/ml/RF2_train/PDB-2021AUG02/torch/pdb

model:
  d_single: 384
  d_pair: 128
  implementation: triton

  trunk:
    embedder:
      d_single: ${model.d_single}
      d_pair: ${model.d_pair}
      implementation: ${model.implementation}

    pairformer:
      n_block: 4
      d_single: ${model.d_single}
      d_pair: ${model.d_pair}
      use_self_attention: True
      implementation: ${model.implementation}

  flow:
    embedder:
      d_pair: ${model.d_pair}
      implementation: ${model.implementation}

    structure_module:
      n_block: 4
      d_single: ${model.d_single}
      final: True
      ipa:
        d_single: ${model.d_single}
        d_pair: ${model.d_pair}
        d_hidden: 256 # TODO: replace d_single
        n_head: 8
        n_qk_point: 8
        n_v_point: 12
        use_structure_attention: True
        use_single_attention: True
        use_pair_value: True

    allatom_module:
      n_block: 2
      d_single: ${model.d_single}
      d_hidden: 128
      implementation: ${model.implementation}

experiment:
  comment: DDP with 4 GPUs, increase learning rate to 4e-4, add layernorm on trunk module

  # Training arguments
  num_batch: 1
  num_epoch: 1000
  max_lr: 4e-4
  min_lr: 1e-5
  warmup_steps: 0
  decay_steps: 1e6
  crop_length : 256
  self_condition: True
  compile: False
  num_augment: 32
  augment: True
  equal_timestep: False
  grad_clip_max_norm: null
  grad_accum_steps: 1

  # Validation arguments
  eval_freq: 10
  eval_sample_num: 5
  eval_timesteps: 100
  eval_input_num: 50
  eval_crop_length: 384

  # Loss weights
  loss:
    t_normalize_clip: 0.9
    aux_loss_weight: 1

    translation_loss_weight: 2.0
    rotation_loss_weight: 1.0

    all_atom_loss_weight: 0.25
    all_atom_loss_t_filter: 0.75

    dist_mat_threshold: 6
    dist_mat_loss_weight: 0
    dist_mat_loss_t_filter: 0.75
