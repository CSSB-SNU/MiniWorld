<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-label="학습 저장값을 유지한 F4-F7 논리적 메모리 전송량: 기존 14T, A 11T, B 10T">
<rect width="960" height="320" fill="#fff"/>
<g font-family="sans-serif" fill="#20394a">
<text x="28" y="34" font-size="20">학습용 저장값을 유지한 F4–F7 메모리 전송량</text>
<text x="28" y="60" font-size="13">T = BF16 [L²,128] · L768에서는 144 MiB · 실제 DRAM 측정값 아님</text>
<text x="28" y="113" font-size="15">기존: 4 / 5 / 6 / 7</text><rect x="258" y="90" width="560" height="36" fill="#748695"/><text x="830" y="113" font-size="15">14T</text>
<text x="28" y="174" font-size="15">A: 4 / (5+6+7)</text><rect x="258" y="151" width="440" height="36" fill="#387abb"/><text x="710" y="174" font-size="15">11T · −432 MiB</text>
<text x="28" y="235" font-size="15">B: (4+5) / (6+7)</text><rect x="258" y="212" width="400" height="36" fill="#218568"/><text x="670" y="235" font-size="15">10T · −576 MiB</text>
<text x="28" y="282" font-size="13">norm·proj·gate는 두 후보 모두 backward를 위해 저장. 그 저장량을 없앴다고 계산하지 않음.</text>
<text x="28" y="303" font-size="13">L2 재사용·tile 재읽기·spill·작은 weight/stat/dropout-scale 트래픽 제외. backward 변경 없음.</text>
</g></svg>